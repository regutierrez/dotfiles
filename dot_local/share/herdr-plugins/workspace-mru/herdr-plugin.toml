id = "dotfiles.workspace-mru"
name = "Workspace MRU"
version = "0.4.0"
min_herdr_version = "0.8.0"
description = "Switch to the previous workspace, then cycle in sidebar order"
platforms = ["linux", "macos"]

[[actions]]
id = "switch"
title = "Switch workspace by recent use and sidebar order"
contexts = ["workspace"]
command = ["./workspace-mru", "switch"]

[[events]]
on = "workspace.focused"
command = ["./workspace-mru", "focused"]

[[events]]
on = "workspace.closed"
command = ["./workspace-mru", "closed"]
