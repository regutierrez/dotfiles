id = "dotfiles.window-numbers"
name = "Window Numbers"
version = "0.3.0"
min_herdr_version = "0.8.0"
description = "Prepend the space-local window number to every Herdr tab (window) name"
platforms = ["linux", "macos"]

[[startup]]
command = ["./window-numbers"]

[[actions]]
id = "renumber"
title = "Renumber window names in every space"
contexts = ["workspace"]
command = ["./window-numbers"]

[[events]]
on = "tab.created"
command = ["./window-numbers"]

[[events]]
on = "tab.closed"
command = ["./window-numbers"]

[[events]]
on = "pane.closed"
command = ["./window-numbers"]

[[events]]
on = "tab.moved"
command = ["./window-numbers"]

[[events]]
on = "tab.renamed"
command = ["./window-numbers"]
