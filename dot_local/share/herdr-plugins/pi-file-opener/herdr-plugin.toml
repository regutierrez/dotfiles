id = "dotfiles.pi-file-opener"
name = "Pi File Opener"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Open Pi source links in an automatically zoomed Nvim pane"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open source link in Nvim"
contexts = ["workspace"]
command = ["node", "open-file.mjs"]

[[panes]]
id = "editor"
title = "Pi file preview"
placement = "overlay"
command = ["node", "open-file.mjs", "--editor"]

[[link_handlers]]
id = "pi-file"
title = "Open Pi source link"
pattern = "^pi-file://open\\?.+$"
action = "open"

[[link_handlers]]
id = "absolute-file"
title = "Open absolute file path"
pattern = "^/[^/]"
action = "open"

[[link_handlers]]
id = "file-url"
title = "Open file URL"
pattern = "^file:///"
action = "open"
