onboarding = false

[terminal]
# New panes and tabs start in the current pane's directory.
new_cwd = "follow"

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui]
pane_borders = true
pane_gaps = false
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
sidebar_width = 32
# Close panes/tabs without prompting.
confirm_close = false
prompt_new_tab_name = false
prompt_new_workspace_name = true

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent"],
  ["$name2"],
]

[ui.sound]
enabled = true

[session]
# Resume supported coding agents when restoring sessions.
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
pane_history = true
kitty_graphics = true
allow_nested = false

[advanced]
# Scrollback limit is byte-based.
scrollback_limit_bytes = 52428800

[keys]
prefix = "backtick"

# Leave prefix+o for Annotate folder review.
open_notification_target = "prefix+ctrl+o"

# Direct pane navigation (Alt/Meta + h/j/k/l)
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]

# Jump to agent panes by priority index
focus_agent = "prefix+alt+1..9"

# Workspace picker
workspace_picker = "prefix+s"

# Splits and new tabs (windows)
split_vertical = "prefix+\\"
split_horizontal = "prefix+minus"
new_tab = "prefix+c"

# Workspaces (Sessions) and Tabs (Windows)
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+r"
rename_tab = "prefix+comma"

# Reload config (prefix + r)
reload_config = "prefix+r"

# Rebind resize mode since prefix+r is now reload_config
resize_mode = "prefix+alt+r"

# Floating scratch shell. Closes when the shell exits.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "cd \"${HERDR_ACTIVE_PANE_CWD:-.}\" && exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+w"
type = "plugin_action"
command = "hseh.spaces"
description = "switch space with hseh"

# Annotate
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate selected text"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[theme]
name = "terminal"
auto_switch = false
