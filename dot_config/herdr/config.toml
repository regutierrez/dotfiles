onboarding = false

[terminal]
# New panes and tabs start in the current pane's directory.
new_cwd = "follow"

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui]
pane_borders = true
pane_gaps = false
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
sidebar_width = 32
# Close panes/tabs without prompting.
confirm_close = false
prompt_new_tab_name = true
prompt_new_workspace_name = true

[ui.sound]
enabled = false

[session]
# Resume supported coding agents when restoring sessions.
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
pane_history = true
kitty_graphics = true
allow_nested = false

[advanced]
# Scrollback limit is byte-based.
scrollback_limit_bytes = 52428800

[keys]
prefix = "backtick"

# Direct pane navigation (Alt/Meta + h/j/k/l)
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]

# Jump to agent panes by priority index
focus_agent = "prefix+alt+1..9"

# Workspace picker
workspace_picker = ["prefix+s", "prefix+w"]

# Splits and new tabs (windows)
split_vertical = "prefix+\\"
split_horizontal = "prefix+minus"
new_tab = "prefix+c"

# Workspaces (Sessions) and Tabs (Windows)
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+r"
rename_tab = "prefix+comma"

# Reload config (prefix + r)
reload_config = "prefix+r"

# Rebind resize mode since prefix+r is now reload_config
resize_mode = "prefix+alt+r"

# Floating scratch shell. Closes when the shell exits.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "cd \"${HERDR_ACTIVE_PANE_CWD:-.}\" && exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "60%"
height = "60%"

[theme]
name = "terminal"
auto_switch = false
