# Single source of truth for installed packages on all machines.
# Run `bash "$(chezmoi source-path)/bootstrap"` after changing these lists.

[packages.darwin]
formulae = [
  "asciinema",
  "chezmoi",
  "delta",
  "eza",
  "fd",
  "ffmpeg",
  "fzf",
  "gh",
  "go",
  "lazygit",
  "mingw-w64",
  "modem-dev/tap/hunk",
  "neovim",
  "pandoc",
  "ripgrep",
  "rust",
  "starship",
  "tailscale",
  "tree-sitter-cli",
  "uv",
  "worktrunk",
  "zoxide",
]
casks = [
  "ghostty",
  "karabiner-elements",
  "obsidian",
  "raycast",
  "shottr",
]
personal_formulae = [
  "mas",
  "nvm",
]
personal_casks = [
  "aldente",
  "homerow",
  "iina",
  "parsec",
]
work_formulae = [
  "bat",
  "btop",
  "colima",
  "direnv",
  "docker",
  "docker-completion",
  "docker-compose",
  "fnm",
]
work_casks = [
  "google-chrome",
]

[packages.pi]
extensions = [
  "npm:@ff-labs/pi-fff",
  "npm:@plannotator/pi-extension",
  "npm:@tintinweb/pi-subagents",
  "git:github.com/dmmulroy/pi-mcp",
]

# CLIs required by managed Pi MCP servers (installed into ~/.npm-global).
[packages.npm]
globals = [
  "open-computer-use",
]

[packages.fedora]
# Personal Fedora gaming workstation packages.
packages = [
  "asciinema",
  "atuin",
  "bat",
  "btop",
  "cargo",
  "chezmoi",
  "curl",
  "dnf5-plugins",
  "docker-compose",
  "eza",
  "fd-find",
  "ffmpeg-free",
  "flatpak",
  "fzf",
  "git",
  "git-delta",
  "gcc-c++",
  "gh",
  "ghostty",
  "gnome-shell-extension-appindicator",
  "golang",
  "jq",
  "mokutil",
  "neovim",
  "openssh-clients",
  "pandoc-cli",
  "pciutils",
  "ripgrep",
  "rust",
  "stow",
  "tree-sitter-cli",
  "unzip",
  "uv",
  "wl-clipboard",
  "zip",
  "zoxide",
  "zsh",
]
# Personal gaming packages. Architecture suffixes preserve Proton support.
gaming_packages = [
  "gamemode",
  "mesa-vulkan-drivers.i686",
  "steam",
  "steam-devices",
  "vulkan-loader.i686",
]
nvidia_packages = [
  "akmod-nvidia",
  "kernel-devel",
  "kernel-headers",
  "xorg-x11-drv-nvidia-libs.i686",
  "xorg-x11-drv-nvidia-power",
]
coprs = [
  "imput/helium",
  "scottames/ghostty",
]
flatpaks = [
  "md.obsidian.Obsidian",
]
