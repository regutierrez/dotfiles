# Single source of truth for installed packages on all machines.
# Run `bash "$(chezmoi source-path)/bootstrap"` after changing these lists.

[packages.darwin]
formulae = [
  "asciinema",
  "chezmoi",
  "delta",
  "eza",
  "fd",
  "ffmpeg",
  "fzf",
  "gh",
  "go",
  "lazygit",
  "mingw-w64",
  "modem-dev/tap/hunk",
  "neovim",
  "pandoc",
  "ripgrep",
  "rust",
  "starship",
  "tailscale",
  "tree-sitter-cli",
  "uv",
  "worktrunk",
  "zoxide",
]
casks = [
  "ghostty",
  "karabiner-elements",
  "obsidian",
  "raycast",
  "shottr",
]
personal_formulae = [
  "mas",
  "nvm",
]
personal_casks = [
  "aldente",
  "homerow",
  "iina",
  "parsec",
]
work_formulae = [
  "bat",
  "btop",
  "colima",
  "direnv",
  "docker",
  "docker-completion",
  "docker-compose",
  "fnm",
]
work_casks = [
  "google-chrome",
]

[packages.pi]
extensions = [
  "npm:@plannotator/pi-extension",
  "npm:pi-herdr-subagents",
]

[packages.arch]
# Installed with paru when available, pacman otherwise (repo packages only).
packages = [
  "asciinema",
  "ast-grep",
  "atuin",
  "bat",
  "chezmoi",
  "docker-compose",
  "eza",
  "fakeroot",
  "fd",
  "ffmpeg",
  "fnm",
  "fzf",
  "git",
  "git-delta",
  "github-cli",
  "go",
  "jq",
  "lazygit",
  "neovim",
  "pandoc-cli",
  "qemu-guest-agent",
  "ripgrep",
  "rust",
  "starship",
  "stow",
  "tree-sitter-cli",
  "uv",
  "wl-clipboard",
  "zoxide",
  "zsh",
]
# AUR + desktop apps; needs paru, skipped on server profile.
aur = [
  "flatpak",
  "google-chrome",
  "helium-browser-bin",
  "joplin-bin",
  "tailscale",
]

[packages.fedora]
# Base packages shared by Fedora profiles.
packages = [
  "asciinema",
  "atuin",
  "bat",
  "btop",
  "cargo",
  "chezmoi",
  "curl",
  "dnf5-plugins",
  "docker-compose",
  "eza",
  "fd-find",
  "ffmpeg-free",
  "fzf",
  "git",
  "git-delta",
  "gh",
  "golang",
  "jq",
  "neovim",
  "openssh-clients",
  "pandoc-cli",
  "ripgrep",
  "rust",
  "stow",
  "tree-sitter-cli",
  "unzip",
  "uv",
  "wl-clipboard",
  "zip",
  "zoxide",
  "zsh",
]
# Desktop packages for personal and work Fedora profiles.
workstation_packages = [
  "dolphin",
  "flatpak",
  "ghostty",
  "keyd",
  "kdotool",
  "mokutil",
  "pciutils",
  "polkit-kde",
]
# Personal gaming packages. Architecture suffixes preserve Proton support.
gaming_packages = [
  "gamemode",
  "mesa-vulkan-drivers.i686",
  "steam",
  "steam-devices",
  "vulkan-loader.i686",
]
nvidia_packages = [
  "akmod-nvidia",
  "kernel-devel",
  "kernel-headers",
  "xorg-x11-drv-nvidia-libs.i686",
  "xorg-x11-drv-nvidia-power",
]
coprs = [
  "alternateved/keyd",
  "imput/helium",
  "scottames/ghostty",
]
flatpaks = [
  "md.obsidian.Obsidian",
]

[packages.debian]
packages = [
  "asciinema",
  "ast-grep",
  "bat",
  "btop",
